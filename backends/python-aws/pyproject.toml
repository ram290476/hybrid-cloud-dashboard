[project]
name = "dashboard-api"
version = "0.1.0"
description = "Hybrid cloud dashboard API, Python on ECS Fargate"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
