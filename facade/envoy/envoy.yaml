# Optional production data plane. Local kind and `make demo` run the Go facade
# instead. This file shows the JSON access log the k3s Envoy would emit.
static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: hcd
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp: "%START_TIME%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          method: "%REQ(:METHOD)%"
                          response_code: "%RESPONSE_CODE%"
                          duration_ms: "%DURATION%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                route_config:
                  name: local
                  virtual_hosts:
                    - name: hcd
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: facade_go }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: facade_go
      type: STRICT_DNS
      load_assignment:
        cluster_name: facade_go
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: facade.hcd.svc.cluster.local, port_value: 8080 }
