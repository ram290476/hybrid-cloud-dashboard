# Cloud routing policy (section 13). Weights are per environment, never per color.
# Blue/green lives inside each environment: Cloud Run revisions, ECS services
# py-api-blue / py-api-green behind one hostname, App Service apps
# dotnet-api-blue / dotnet-api-green. Replace example.com after Ram picks a domain.
apiVersion: hcd.ram.dev/v1
kind: RoutingPolicy
metadata:
  name: hcd
  version: "2026.10.10"
spec:
  evaluation:
    interval_s: 15
    ewma_alpha: 0.3
    min_dwell_s: 120
    hysteresis_pct: 10
    min_probe_weight: 2
  budget:
    monthly_usd: 50
    alert_at_pct: [50, 80, 100]
    on_exceed: lowest-cost
  on_all_caps: gcp-go
  backends:
    - name: gcp-go
      endpoint: https://go-api.example.com
      labels: { lang: go, runtime: cloud-run }
      cost: { per_million_requests_usd: 0.40, per_gb_egress_usd: 0.12 }
      free_tier: { requests: 2000000, threshold_pct: 80 }
      hard_cap_monthly_usd: 5
      max_weight: 100
    - name: azure-dotnet
      endpoint: https://dotnet-api.example.com
      labels: { lang: dotnet, runtime: app-service }
      cost: { per_million_requests_usd: 0.40, per_gb_egress_usd: 0.087 }
      free_tier: { requests: 2000000, gib_seconds: 640000, threshold_pct: 80 }
      hard_cap_monthly_usd: 5
      max_weight: 100
    - name: aws-python
      endpoint: https://aws-python.example.com
      labels: { lang: python, runtime: ecs-fargate }
      cost: { per_million_requests_usd: 0.60, per_gb_egress_usd: 0.09 }
      free_tier: { requests: 1000000, threshold_pct: 80 }
      hard_cap_monthly_usd: 5
      max_weight: 100
  routes:
    - match: { path_prefix: /api/v1/prefs }
      policy: lowest-cost
      weights: { w_cost: 0.6, w_perf: 0.2, w_err: 0.2 }
      slo_floor: { p95_ms: 400, error_rate: 0.01 }
      fallback_order: [gcp-go, azure-dotnet, aws-python]
      affinity: { hash_on: jwt-sub }
    - match: { path_prefix: /api }
      policy: free-tier-first
      weights: { w_cost: 0.5, w_perf: 0.3, w_err: 0.2 }
      slo_floor: { p95_ms: 400, error_rate: 0.01 }
      fallback_order: [gcp-go, azure-dotnet, aws-python]
  overrides: []
