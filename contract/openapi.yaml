openapi: 3.1.0
info:
  title: Hybrid Cloud Dashboard API
  version: 1.0.0
  summary: Shared contract for the Go, Python, and .NET backends.
  description: |
    Every backend serves this surface. The facade adds /api/v1/facade/state and
    /api/v1/facade/rollout, which are not part of the backend contract.
servers:
  - url: http://localhost/api/v1
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
  /readyz:
    get:
      operationId: readyz
      security: []
      responses:
        "200":
          description: Dependencies answered.
        "503":
          description: A dependency is down.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /version:
    get:
      operationId: version
      security: []
      responses:
        "200":
          description: Build identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
  /api/v1/data-health:
    get:
      operationId: getDataHealth
      summary: Report this backend's serving-store freshness.
      description: |
        Reads the backend's own hcd-serving store. A missing or stale object is a
        warning inside a 200 response, not an error. Data is fresh when both
        serving/dashboard.json and serving/status.json are present and the older
        of their generated_at (or last_modified) timestamps is at most
        fresh_within_seconds old. That window is 36 hours, a margin past one
        daily collector run. Older data is stale. A missing file is missing.
      responses:
        "200":
          description: Freshness report for this backend's store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataHealth"
        "401":
          description: Missing bearer token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Market snapshot object from the serving bucket.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/status:
    get:
      operationId: getStatus
      responses:
        "200":
          description: Feed status object from the serving bucket.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/chart/{ticker}:
    get:
      operationId: getChart
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chart payload for one ticker.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Unknown ticker.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/stock/{ticker}:
    get:
      operationId: getStock
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
          example: TSLA
      responses:
        "200":
          description: Company page object from serving/stock/{ticker}.json.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                ticker: TSLA
                data_version: fixture-2026.10.09
                name: Tesla
                company_description: Electric vehicles and energy storage.
                metrics: []
                unavailable: []
        "404":
          description: The stock object is missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: missing serving/stock/NOPE.json
  /api/v1/fund/{ticker}:
    get:
      operationId: getFund
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
          example: ARKK
      responses:
        "200":
          description: Fund holdings object from serving/funds/{ticker}.json.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                ticker: ARKK
                schema_version: 1
                data_version: fixture-2026.10.09
                status: ready
                fund_name: ARK Innovation ETF
                holdings_source: sec_nport
                holdings_as_of: "2026-09-30"
                holdings:
                  - ticker: TSLA
                    name: Tesla
                    pct_nav: 12.5
                    value_usd: 1000000
        "404":
          description: The fund object is missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: missing serving/funds/NOPE.json
  /api/v1/prefs:
    get:
      operationId: getPrefs
      responses:
        "200":
          description: Projected preferences for the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prefs"
    put:
      operationId: putPrefs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Prefs"
      responses:
        "200":
          description: Preferences after the field-level write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prefs"
        "409":
          description: Version conflict.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Identity:
      type: object
      required: [status, backend, lang, runtime, color, version, data_version]
      properties:
        status: { type: string }
        backend: { type: string, enum: [gcp-go, aws-python, azure-dotnet] }
        lang: { type: string, enum: [go, python, dotnet] }
        runtime: { type: string }
        color: { type: string, enum: [blue, green] }
        version: { type: string }
        data_version: { type: string }
    Prefs:
      type: object
      required: [tickers, pinned, display, version]
      properties:
        tickers:
          type: array
          maxItems: 25
          items: { type: string }
        pinned:
          type: array
          maxItems: 6
          items: { type: string }
        display:
          type: object
          additionalProperties: true
          properties:
            theme: { type: string }
            time_zone: { type: string }
            updown_palette: { type: string }
            chart_period: { type: string }
            panel_mode: { type: string, enum: [follow, all] }
        chart_settings:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
        version: { type: integer }
        updated_at: { type: string }
    DataHealth:
      type: object
      required:
        - backend
        - lang
        - runtime
        - color
        - version
        - data_version
        - cloud
        - checked_at
        - freshness
        - fresh_within_seconds
        - counts
        - files
        - tickers
        - newest_at
        - oldest_at
        - collectors
        - import
        - warnings
      properties:
        backend: { type: string, enum: [gcp-go, aws-python, azure-dotnet] }
        lang: { type: string, enum: [go, python, dotnet] }
        runtime: { type: string }
        color: { type: string }
        version: { type: string }
        data_version: { type: string }
        cloud: { type: string, enum: [gcp, aws, azure] }
        checked_at: { type: string, format: date-time }
        freshness: { type: string, enum: [fresh, stale, missing] }
        fresh_within_seconds: { type: integer, const: 129600 }
        counts:
          $ref: "#/components/schemas/DataHealthCounts"
        files:
          type: object
          required: [dashboard, status]
          properties:
            dashboard: { $ref: "#/components/schemas/DataHealthFile" }
            status: { $ref: "#/components/schemas/DataHealthFile" }
        tickers:
          type: array
          items: { type: string }
        newest_at: { type: ["string", "null"], format: date-time }
        oldest_at: { type: ["string", "null"], format: date-time }
        collectors:
          type: array
          items: { $ref: "#/components/schemas/DataHealthCollector" }
        import:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DataHealthImport"
        warnings:
          type: array
          items: { type: string }
    DataHealthCounts:
      type: object
      required: [chart, stock, funds]
      properties:
        chart: { type: integer, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        funds: { type: integer, minimum: 0 }
    DataHealthFile:
      type: object
      required: [key, present, generated_at, last_modified, age_seconds]
      properties:
        key: { type: string }
        present: { type: boolean }
        generated_at: { type: ["string", "null"] }
        last_modified: { type: ["string", "null"] }
        age_seconds: { type: ["integer", "null"] }
    DataHealthCollector:
      type: object
      required: [name, status, last_run, age_seconds]
      properties:
        name: { type: string }
        status: { type: string }
        last_run: { type: string }
        age_seconds: { type: ["integer", "null"] }
    DataHealthImport:
      type: object
      required: [source, at]
      properties:
        source: { type: string, examples: [local-seed, dash-import] }
        origin: { type: string, examples: [contract-fixtures, investor-dashboard] }
        at: { type: string, format: date-time }
        age_seconds: { type: ["integer", "null"] }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
security:
  - bearerAuth: []
