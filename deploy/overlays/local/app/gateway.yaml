apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hcd
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hcd
spec:
  parentRefs:
  - name: hcd
  rules:
  - matches:
    - path:
        type: Exact
        value: /healthz
    - path:
        type: Exact
        value: /readyz
    - path:
        type: Exact
        value: /version
    backendRefs:
    - name: facade
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: facade
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend
      port: 8080
