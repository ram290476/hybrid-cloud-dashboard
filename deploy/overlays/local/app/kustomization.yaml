apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hcd
resources:
  - namespace.yaml
  - ../../../base/go-gcp
  - ../../../base/python-aws
  - ../../../base/dotnet-azure
  - ../../../base/facade
  - ../../../base/frontend
  - gateway.yaml
patches:
  - path: frontend-config-patch.yaml
configMapGenerator:
  - name: facade-policy
    files:
      - routing-policy.kind.yaml
  - name: frontend-config
    files:
      - config.json=config.local.json
generatorOptions:
  disableNameSuffixHash: true
