apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "local",
          "credentials": [{"accessKey": "minioadmin", "secretKey": "minioadmin"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels: { app: seaweedfs }
  template:
    metadata:
      labels: { app: seaweedfs }
    spec:
      containers:
      - name: seaweedfs
        image: chrislusf/seaweedfs:3.80
        args: ["server", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweed/s3.json", "-dir=/data", "-ip=0.0.0.0", "-ip.bind=0.0.0.0"]
        ports:
        - containerPort: 9000
          name: s3
        - containerPort: 9333
          name: master
        volumeMounts:
        - name: s3
          mountPath: /etc/seaweed
        readinessProbe:
          tcpSocket: { port: 9000 }
          periodSeconds: 5
      volumes:
      - name: s3
        configMap:
          name: seaweedfs-s3
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector: { app: seaweedfs }
  ports:
  - name: s3
    port: 9000
    targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app: seaweedfs }
  ports:
  - name: s3
    port: 9000
    targetPort: 9000
