apiVersion: apps/v1
kind: Deployment
metadata:
  name: firestore
spec:
  replicas: 1
  selector:
    matchLabels: { app: firestore }
  template:
    metadata:
      labels: { app: firestore }
    spec:
      containers:
      - name: firestore
        image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
        command: ["gcloud"]
        args: ["beta", "emulators", "firestore", "start", "--host-port=0.0.0.0:8080", "--project=hcd-local"]
        env:
        - name: CLOUDSDK_CORE_PROJECT
          value: hcd-local
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket: { port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: firestore
spec:
  selector: { app: firestore }
  ports:
  - port: 8080
    targetPort: 8080
