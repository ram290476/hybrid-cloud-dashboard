apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-gcs
spec:
  replicas: 1
  selector:
    matchLabels: { app: fake-gcs }
  template:
    metadata:
      labels: { app: fake-gcs }
    spec:
      containers:
      - name: fake-gcs
        image: fsouza/fake-gcs-server:1.52.2
        securityContext:
          runAsUser: 0
        args: ["-scheme", "http", "-port", "4443", "-backend", "filesystem", "-filesystem-root", "/storage", "-public-host", "fake-gcs.hcd-deps.svc.cluster.local:4443"]
        ports:
        - containerPort: 4443
        volumeMounts:
        - name: data
          mountPath: /storage
        readinessProbe:
          httpGet: { path: /storage/v1/b, port: 4443 }
      # Kind node disk. A pod restart keeps the bucket. Deleting the cluster does not.
      volumes:
      - name: data
        hostPath:
          path: /var/lib/hcd/fake-gcs
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: fake-gcs
spec:
  selector: { app: fake-gcs }
  ports:
  - port: 4443
    targetPort: 4443
