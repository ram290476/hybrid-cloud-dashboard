apiVersion: apps/v1
kind: Deployment
metadata:
  name: azurite
spec:
  replicas: 1
  selector:
    matchLabels: { app: azurite }
  template:
    metadata:
      labels: { app: azurite }
    spec:
      containers:
      - name: azurite
        image: mcr.microsoft.com/azure-storage/azurite:3.33.0
        securityContext:
          runAsUser: 0
        args: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data", "--loose", "--skipApiVersionCheck", "--disableProductStyleUrl"]
        ports:
        - containerPort: 10000
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          tcpSocket: { port: 10000 }
      # Kind node disk. A pod restart keeps the blob data. Deleting the cluster does not.
      volumes:
      - name: data
        hostPath:
          path: /var/lib/hcd/azurite
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: azurite
spec:
  selector: { app: azurite }
  ports:
  - port: 10000
    targetPort: 10000
