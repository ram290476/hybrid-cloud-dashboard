apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb
spec:
  replicas: 1
  selector:
    matchLabels: { app: dynamodb }
  template:
    metadata:
      labels: { app: dynamodb }
    spec:
      containers:
      - name: dynamodb
        image: amazon/dynamodb-local:2.5.2
        args: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
        ports:
        - containerPort: 8000
        readinessProbe:
          tcpSocket: { port: 8000 }
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb
spec:
  selector: { app: dynamodb }
  ports:
  - port: 8000
    targetPort: 8000
