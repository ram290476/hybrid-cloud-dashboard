apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      otlphttp/local:
        endpoint: http://lgtm.observability.svc.cluster.local:4318
      otlphttp/grafana:
        endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
        headers:
          authorization: ${env:GRAFANA_OTLP_AUTH}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/local]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/local]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/local]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      containers:
      - name: collector
        image: otel/opentelemetry-collector-contrib:0.111.0
        args: ["--config=/etc/otel/config.yaml"]
        env:
        - name: GRAFANA_OTLP_ENDPOINT
          value: https://otlp-gateway.example.com/otlp
        - name: GRAFANA_OTLP_AUTH
          value: Basic placeholder
        ports:
        - containerPort: 4317
        - containerPort: 4318
        volumeMounts:
        - name: config
          mountPath: /etc/otel
      volumes:
      - name: config
        configMap:
          name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector: { app: otel-collector }
  ports:
  - name: grpc
    port: 4317
  - name: http
    port: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
spec:
  replicas: 1
  selector:
    matchLabels: { app: lgtm }
  template:
    metadata:
      labels: { app: lgtm }
    spec:
      containers:
      - name: lgtm
        image: grafana/otel-lgtm:0.11.0
        ports:
        - containerPort: 3000
        - containerPort: 4317
        - containerPort: 4318
        resources:
          requests: { memory: 512Mi }
          limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
spec:
  selector: { app: lgtm }
  ports:
  - name: grafana
    port: 3000
  - name: otlp-grpc
    port: 4317
  - name: otlp-http
    port: 4318
