apiVersion: v1
kind: Service
metadata:
  name: dotnet-azure
spec:
  selector:
    app: dotnet-azure
    version: blue
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-azure-preview
spec:
  selector:
    app: dotnet-azure
    version: green
  ports:
  - name: http
    port: 8080
    targetPort: 8080
