apiVersion: v1
kind: Service
metadata:
  name: go-gcp
spec:
  selector:
    app: go-gcp
    version: blue
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: go-gcp-preview
spec:
  selector:
    app: go-gcp
    version: green
  ports:
  - name: http
    port: 8080
    targetPort: 8080
