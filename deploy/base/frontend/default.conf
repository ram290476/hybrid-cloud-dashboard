server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # A missing config must be a 404. Falling through to index.html makes
  # fetch("/config.json") parse HTML and hide the real error.
  location = /config.json {
    try_files $uri =404;
    default_type application/json;
    add_header Cache-Control "no-store";
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
