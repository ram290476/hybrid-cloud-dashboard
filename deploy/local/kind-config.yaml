kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hcd
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry]
    config_path = "/etc/containerd/certs.d"
nodes:
- role: control-plane
  extraPortMappings:
  # Envoy's Service is NodePort 30080. kind publishes that on the Mac as :80.
  - containerPort: 30080
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
