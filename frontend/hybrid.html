<!doctype html>
<html lang="en" data-theme="industrial-dark" style="color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0e13" />
    <title>Hybrid operations</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      .ops { max-width: 1180px; margin: 0 auto; padding: 28px 20px 64px; }
      .ops-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; margin-bottom: 22px; }
      .ops-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
      .metric { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; }
      .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 8px; }
      .bar span { display: block; height: 100%; background: var(--blue); }
      .dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; margin-right: 6px; background: var(--red); }
      .dot.up { background: var(--green); }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-weight: 500; }
      a { color: var(--blue); }
      .ops-tabs { display: flex; gap: 8px; margin: 0 0 18px; }
      .ops-tabs button { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
      .ops-tabs button[aria-selected="true"] { color: var(--text); border-color: var(--blue); }
      .badge { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
      .badge.fresh { color: var(--green); }
      .badge.stale { color: var(--amber); }
      .badge.missing { color: var(--red); }
      .health-alert { color: var(--amber); margin: 0 0 12px; }
      .health-row { display: flex; justify-content: space-between; gap: 12px; margin: 4px 0; }
      .health-row span:last-child { text-align: right; }
      .disagree { background: color-mix(in srgb, var(--amber) 22%, transparent); border-radius: 4px; }
      .job.ok { color: var(--green); }
      .job.bad { color: var(--red); }
      .job.warn { color: var(--amber); }
      .collectors, .warnings { margin: 8px 0 0; padding-left: 18px; }
      .ops-filters { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; margin-bottom: 14px; }
      .ops-filters fieldset { border: 1px solid var(--line); border-radius: 8px; display: flex; gap: 10px; padding: 8px 10px; }
      .ops-filters legend { padding: 0 4px; color: var(--muted); }
      .ops-filters label { display: flex; gap: 6px; align-items: center; color: var(--text); }
      .ranges { display: flex; gap: 6px; }
      .ranges button { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
      .ranges button[aria-pressed="true"] { color: var(--text); border-color: var(--blue); }
      .ops-filters .custom-range { display: none; }
      .ops-filters[data-range="custom"] .custom-range { display: flex; }
      .badge.level-error, .level-error { color: var(--red); }
      .badge.level-warn, .level-warn { color: var(--amber); }
      .badge.level-info { color: var(--blue); }
      .badge.level-debug { color: var(--muted); }
      tr.log-gcp td:nth-child(2) { color: var(--blue); }
      tr.log-aws td:nth-child(2) { color: var(--green); }
      tr.log-azure td:nth-child(2) { color: var(--amber); }
      tr.log-facade td:nth-child(2) { color: var(--text); }
      .logs pre { white-space: pre-wrap; }
      #alert-count { margin-left: 6px; color: var(--amber); }
      tr.resolved { opacity: 0.55; }
      .badge.severity-critical { color: var(--red); }
      .badge.severity-warning { color: var(--amber); }
      .badge.severity-info { color: var(--blue); }
      @media (max-width: 800px) {
        .ops-grid { grid-template-columns: 1fr; }
        .ops-head { flex-direction: column; align-items: flex-start; }
      }
    </style>
    <script type="module" src="/hybrid.js"></script>
  </head>
  <body>
    <main class="ops">
      <header class="ops-head">
        <div>
          <p class="eyebrow">HYBRID CLOUD</p>
          <h1>Operations</h1>
          <p class="muted">One UI, three backends. The facade picks a live color and writes an audit line for every API call.</p>
        </div>
        <p><a href="/">Market dashboard</a></p>
      </header>
      <nav class="ops-tabs" role="tablist" aria-label="Operations">
        <button type="button" role="tab" id="tab-ops" data-tab="ops" aria-selected="true" aria-controls="panel-ops">Operations</button>
        <button type="button" role="tab" id="tab-health" data-tab="health" aria-selected="false" aria-controls="panel-health">Data health</button>
        <button type="button" role="tab" id="tab-logs" data-tab="logs" aria-selected="false" aria-controls="panel-logs">Logs</button>
        <button type="button" role="tab" id="tab-alerts" data-tab="alerts" aria-selected="false" aria-controls="panel-alerts">Alerts <span id="alert-count" hidden></span></button>
      </nav>
      <div id="panel-ops" role="tabpanel" aria-labelledby="tab-ops">
        <section id="cards" class="ops-grid" aria-live="polite"></section>
        <section class="panel" style="margin-top: 16px">
          <header class="panel-header"><h2>Routing</h2></header>
          <div class="panel-body" id="routes"></div>
        </section>
        <section class="panel" style="margin-top: 16px">
          <header class="panel-header"><h2>Audit log</h2></header>
          <div class="panel-body" id="audit"></div>
        </section>
      </div>
      <div id="panel-health" role="tabpanel" aria-labelledby="tab-health" hidden>
        <div id="health" aria-live="polite"></div>
      </div>
      <div id="panel-logs" role="tabpanel" aria-labelledby="tab-logs" hidden>
        <div id="logs"></div>
      </div>
      <div id="panel-alerts" role="tabpanel" aria-labelledby="tab-alerts" hidden>
        <div id="alerts"></div>
      </div>
    </main>
  </body>
</html>
