name: ci

on:
  push:
  pull_request:
    # PR #1 targets main. Fix PRs target the unmerged integration branch, which
    # is not the default branch, so the base has to be listed or Actions skips them.
    branches:
      - main
      - cursor/hybrid-cloud-v2-4a4d
      - "cursor/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.0.2
        with:
          go-version: "1.22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Python dependencies
        run: python3 -m pip install fastapi uvicorn boto3 pytest httpx mangum
      - name: Tests
        run: make test

  terraform:
    # HashiCorp Terraform 1.9.8. Each root sets required_version >= 1.6.0.
    # This job validates only. It does not apply.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
      - name: Validate
        run: make terraform-validate
